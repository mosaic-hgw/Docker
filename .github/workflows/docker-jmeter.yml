name: Build and push jmeter-image

on:
  push:
    branches:
      - main
    paths:
      - 'image/jmeter/**'
      - '.github/workflows/docker-jmeter.yml'

  workflow_run:
    workflows:
      - Build and push zulujre-image
    types:
      - completed

  workflow_dispatch:

concurrency:
  group: jmeter-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: docker

    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve and verify Base base image
        id: base
        shell: bash
        env:
          BASE_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/zulujre
        run: |
          set -euo pipefail

          echo "Resolving ${BASE_IMAGE}:latest"
          digest="$(docker buildx imagetools inspect "${BASE_IMAGE}:latest" | awk '/^Digest:/ && !found { print $2; found=1 }')"
          if [ -z "${digest}" ]; then
            echo "ERROR: Could not determine base image digest"
            exit 1
          fi

          echo "base digest: ${digest}"
          cosign verify \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-zulujre.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${BASE_IMAGE}@${digest}"

          echo "base image signature verified successfully."
          echo "image=${BASE_IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        
      - name: Get JMeter version
        id: jmeter
        shell: bash
        run: |
          set -euo pipefail
          
          fullversion=$(grep -E '^ARG JMETER_VERSION=' image/jmeter/Dockerfile.jmeter.5 \
            | sed -E 's/^ARG JMETER_VERSION="?([0-9\.]+)"?/\1/' \
            | head -n1)
          majorversion="${fullversion%%.*}"

          echo "JMeter full version: ${fullversion}"
          echo "JMeter major version: ${majorversion}"

          echo "fullversion=${fullversion}" >> "$GITHUB_OUTPUT"
          echo "majorversion=${majorversion}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./image/jmeter
          file: ./image/jmeter/Dockerfile.jmeter.5
          build-args: |
            TAG=${{ steps.base.outputs.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jmeter:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jmeter:${{ steps.jmeter.outputs.fullversion }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jmeter:${{ steps.jmeter.outputs.majorversion }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign multi-arch image
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/jmeter
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Signing ${IMAGE}@${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"