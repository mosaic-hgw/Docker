name: Build and push mysql-image

on:
  push:
    branches:
      - main
    paths:
      - 'image/mysql/**'
      - '.github/workflows/docker-mysql.yml'

  workflow_run:
    workflows:
      - Build and push debian-image
    types:
      - completed

  workflow_dispatch:

concurrency:
  group: mysql-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: docker

    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve and verify Debian base image
        id: debian
        shell: bash
        env:
          DEBIAN_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/debian
        run: |
          set -euo pipefail

          echo "Resolving ${DEBIAN_IMAGE}:latest"
          digest="$(docker buildx imagetools inspect "${DEBIAN_IMAGE}:latest" | awk '/^Digest:/ && !found { print $2; found=1 }')"
          if [ -z "${digest}" ]; then
            echo "ERROR: Could not determine Debian image digest"
            exit 1
          fi

          echo "Debian digest: ${digest}"
          cosign verify \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-debian.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${DEBIAN_IMAGE}@${digest}"

          echo "Debian image signature verified successfully."
          echo "image=${DEBIAN_IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        
      - name: Get MySQL version
        id: mysql
        shell: bash
        run: |
          set -euo pipefail
          
          fullversion=$(grep -E '^ARG MYSQL_VERSION=' image/mysql/Dockerfile.mysql.9 \
            | sed -E 's/^ARG MYSQL_VERSION="?([0-9\.]+)"?/\1/' \
            | head -n1)
          majorversion="${fullversion%%.*}"

          echo "MySQL full version: ${fullversion}"
          echo "MySQL major version: ${majorversion}"

          echo "fullversion=${fullversion}" >> "$GITHUB_OUTPUT"
          echo "majorversion=${majorversion}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./image/mysql
          file: ./image/mysql/Dockerfile.mysql.9
          build-args: |
            TAG=${{ steps.debian.outputs.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mysql:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mysql:${{ steps.mysql.outputs.fullversion }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mysql:${{ steps.mysql.outputs.majorversion }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign multi-arch image
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mysql
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Signing ${IMAGE}@${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"