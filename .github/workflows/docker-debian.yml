name: Build and push debian-image

on:
  push:
    branches:
      - main
    paths:
      - 'image/debian/**'
      - '.github/workflows/docker-debian.yml'
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

env:
  CURRENT_IMAGE_NAME: "debian"
  DOCKERFILE: "Dockerfile.debian"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: docker

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          docker pull debian:stable-slim

          fullversion=$(docker run --rm debian:stable-slim cat /etc/debian_version)
          majorversion="${fullversion%%.*}"

          echo "Debian full version: ${fullversion}"
          echo "Debian major version: ${majorversion}"

          echo "fullversion=${fullversion}" >> "$GITHUB_OUTPUT"
          echo "majorversion=${majorversion}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./image/${{ env.CURRENT_IMAGE_NAME }}
          file: ./image/${{ env.CURRENT_IMAGE_NAME }}/${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CURRENT_IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CURRENT_IMAGE_NAME }}:${{ steps.version.outputs.fullversion }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CURRENT_IMAGE_NAME }}:${{ steps.version.outputs.majorversion }}

      - name: Sign multi-arch image
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CURRENT_IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Signing ${IMAGE}@${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"