name: Build and push debian-image

on:
  push:
    branches:
      - main
    paths:
      - 'image/debian/**'
      - '.github/workflows/docker-debian.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get Debian version
        id: debian
        shell: bash
        run: |
          docker pull debian:stable-slim

          fullversion=$(docker run --rm debian:stable-slim cat /etc/debian_version)
          majorversion="${fullversion%%.*}"

          echo "Debian full version: ${fullversion}"
          echo "Debian major version: ${majorversion}"

          echo "fullversion=${fullversion}" >> "$GITHUB_OUTPUT"
          echo "majorversion=${majorversion}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./image/debian
          file: ./image/debian/Dockerfile.debian
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/debian:latest
            ${{ vars.DOCKERHUB_USERNAME }}/debian:${{ steps.debian.outputs.fullversion }}
            ${{ vars.DOCKERHUB_USERNAME }}/debian:${{ steps.debian.outputs.majorversion }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
